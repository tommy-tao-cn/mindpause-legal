<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Pause — Legal &amp; Support</title>
<style>
  :root{
    --bg:#F7F4EC; --card:#FFFDF7; --ink:#2F3A33; --muted:#6B7A70;
    --accent:#3E6B52; --line:#E4DFD3;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{max-width:680px; margin:0 auto; padding:64px 24px 80px}
  .badge{
    display:inline-block; padding:6px 12px; border-radius:999px;
    background:var(--accent); color:#fff; font-size:13px; letter-spacing:.02em;
  }
  h1{font-size:34px; line-height:1.25; margin:20px 0 12px}
  p.lead{color:var(--muted); margin:0 0 32px}
  a.card{
    display:block; padding:22px 24px; margin-bottom:14px; text-decoration:none;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    color:var(--ink); transition:border-color .15s ease, transform .15s ease;
  }
  a.card:hover{border-color:var(--accent); transform:translateY(-1px)}
  a.card strong{display:block; font-size:17px; margin-bottom:4px}
  a.card span{color:var(--muted); font-size:14px}
  footer{margin-top:40px; color:var(--muted); font-size:14px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <span class="badge">Mind Pause</span>
  <h1>Legal &amp; Support</h1>
  <p class="lead">Everything you need to know about privacy, subscriptions, and getting help.</p>

  <a class="card" href="privacy.html">
    <strong>Privacy Policy</strong>
    <span>What Mind Pause does — and does not — do with your information.</span>
  </a>

  <a class="card" href="support.html">
    <strong>Support</strong>
    <span>Setup help, subscription questions, and how to reach us.</span>
  </a>

  <footer>
    Contact: <a href="mailto:hellofeedbackdesk@outlook.com">hellofeedbackdesk@outlook.com</a>
  </footer>
</main>
</body>
</html>
